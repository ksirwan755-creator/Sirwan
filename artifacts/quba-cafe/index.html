        var boot = document.getElementById('quba-boot');
        if (boot) boot.innerHTML = '<div style="max-width:360px"><strong style="font-size:28px">QUBA</strong><p>هەڵەیەک لە بارکردنی بەرنامەکە ڕوویدا. تکایە پەڕەکە نوێ بکەرەوە.</p></div>';
